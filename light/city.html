<script src="assets/icons/lucide.min.js"></script>
<script>
  lucide.createIcons();
  var toastEl = document.getElementById('toast'), toastT;
  function toast(t) { if (!toastEl || !t) return; toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2200); }

  var q = document.getElementById('q');
  q.addEventListener('input', function () {
    var v = q.value.trim().toLowerCase(), n = 0;
    document.querySelectorAll('[data-city]').forEach(function (r) { var on = r.dataset.city.indexOf(v) === 0; r.hidden = !on; if (on) n++; });
    document.querySelector('[data-all]').hidden = v.length > 0;
    document.getElementById('none').hidden = n > 0;
  });
  document.getElementById('back').addEventListener('click', function (e) { if (history.length > 1) { e.preventDefault(); history.back(); } });
</script>
