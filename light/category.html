<script>
  lucide.createIcons();
  var toastEl = document.getElementById('toast'), toastT;
  function toast(t) { if (!toastEl || !t) return; toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2200); }

  var names = ["Жіночий одяг", "Чоловічий одяг", "Взуття", "Смартфони"], cur = -1;
  function show(i) {
    cur = i;
    document.getElementById('root').hidden = i >= 0;
    document.querySelectorAll('[data-level]').forEach(function (s) { s.hidden = +s.dataset.level !== i; });
    document.getElementById('ttl').textContent = i >= 0 ? names[i] : 'Категорія';
  }
  document.querySelectorAll('[data-open]').forEach(function (b) { b.addEventListener('click', function () { show(+b.dataset.open); }); });
  document.getElementById('back').addEventListener('click', function (e) { if (cur >= 0) { e.preventDefault(); show(-1); } });

  if (new URLSearchParams(location.search).get('from') === 'ai') document.querySelectorAll('a[href^="create.html"]').forEach(function (a) { a.setAttribute('href', 'create-ai.html?step=2'); });
</script>
