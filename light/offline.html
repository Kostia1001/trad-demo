<div class="do"><button class="btn primary" type="button" id="retry">Спробувати ще раз</button></div>
</div></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/icons/lucide.min.js"></script>
<script>
  lucide.createIcons();
  var Q = new URLSearchParams(location.search);
  var b = document.getElementById('retry'), t = document.getElementById('toast');
  b.addEventListener('click', function () {
    b.disabled = true; b.textContent = 'Перевіряємо…';
    setTimeout(function () { b.disabled = false; b.textContent = 'Спробувати ще раз'; t.textContent = 'З’єднання досі немає'; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 2200); }, 1200);
  });
</script>
