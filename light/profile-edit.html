<div class="toast" id="toast" role="status"></div>
<script src="assets/icons/lucide.min.js"></script>
<script>
  lucide.createIcons();
  var toastEl = document.getElementById('toast'), toastT;
  function toast(t) { if (!toastEl || !t) return; toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2200); }

  var nameEl = document.getElementById('name'), save = document.getElementById('save');
  nameEl.addEventListener('input', function () { var ok = !!nameEl.value.trim(); save.disabled = !ok; document.getElementById('nhint').hidden = ok; });
  save.addEventListener('click', function () { toast('Зміни збережено'); });

  document.querySelector('.avaedit .mini').addEventListener('click', function () { toast('Фото оновлено'); });
</script>
